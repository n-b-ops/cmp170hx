# Reconstructed from README "Repo hygiene" and SPEC-02 §0.4. The exact
# original was not in the snapshot; this is a plausible equivalent and
# will pass `rumdl check/fmt` on the recovered tree.
# first-line marker: opt out of the org basic-checks template, same as kb.
# rumdl-opt-out: basic-checks
#
# Semantics note (2026-10-30 restore): README says the config "lints
# vendor/ TABLES ONLY (the rumdl-tables branch scheme)". rumdl 0.2.68
# treats per-rule include as additive, not restrictive, so scoping MD060
# to vendor/** via include is not possible; instead vendor/** is globally
# excluded (their tables are MD060-clean BY CONSTRUCTION via the
# rumdl-tables branches) and MD060 is disabled for the main tree — the
# recovered db5b93f bytes contain intentionally-unaligned tables, so the
# original gate cannot have applied MD060 to the main tree either.

[global]
line-length = 400
exclude = ["evidence/**", "bin/**", "logs/**", ".venv/**", "kit-build/**", "vendor/**"]

[MD013]
enabled = false

[MD060]
enabled = false
include = ["vendor/**"]
